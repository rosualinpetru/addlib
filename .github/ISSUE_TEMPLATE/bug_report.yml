# SPDX-License-Identifier: Apache-2.0
name: 🐛 Bug report
description: Report incorrect behavior (NOT a security vulnerability)
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! ⚠️ **Do not report security vulnerabilities here** —
        use private reporting (see [SECURITY.md](https://github.com/rosualinpetru/addlib/blob/main/SECURITY.md)).
  - type: input
    id: version
    attributes:
      label: addlib version
      description: 'Output of `python -c "import addlib; print(addlib.__version__, addlib.c_version())"`'
      placeholder: "0.1.0 0.1.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest snippet that shows the problem.
      render: python
      placeholder: |
        from addlib import add
        add(...)  # observed: ... ; expected: ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
    validations:
      required: true
