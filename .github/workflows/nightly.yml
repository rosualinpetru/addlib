# SPDX-License-Identifier: Apache-2.0
# Heavier, slower checks that don't belong in the PR path: continuous fuzzing,
# Valgrind, and benchmark tracking. Runs nightly and on demand.
name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: libFuzzer (deserialization-style target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build fuzz target with clang
        run: |
          cmake -S . -B build -DADDLIB_BUILD_FUZZERS=ON -DCMAKE_C_COMPILER=clang
          cmake --build build --target fuzz_add
      - name: Fuzz for 120s
        run: ./build/fuzz_add -max_total_time=120 -print_final_stats=1
      - name: Upload crashers (if any)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: crash-*

  valgrind:
    name: Valgrind (memcheck) on C tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: cmake -S . -B build -DADDLIB_BUILD_TESTS=ON
      - run: cmake --build build
      - run: valgrind --error-exitcode=1 --leak-check=full --track-origins=yes ./build/test_add

  benchmarks:
    name: Benchmark trend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Run benchmarks
        run: pytest benchmarks --benchmark-only --benchmark-json=benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark.json
