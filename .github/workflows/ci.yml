# SPDX-License-Identifier: Apache-2.0
# Fast PR pipeline: lint + unit tests across the matrix + sanitized C build +
# packaging smoke test. Heavier work (fuzzing, valgrind, benchmarks) runs in
# nightly.yml. Target: keep this under ~10 minutes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (C + Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python dev deps (incl. pinned clang-format)
        run: python -m pip install -e ".[dev]"
      - name: ruff (lint + format check)
        run: |
          ruff check .
          ruff format --check .
      - name: mypy
        run: mypy
      - name: clang-format check (pinned via dev deps)
        run: clang-format --dry-run --Werror c/src/*.c c/include/add/*.h c/tests/*.c c/fuzz/*.c c/bench/*.c examples/*.c

  test:
    name: Test ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install (builds the CFFI extension)
        run: python -m pip install -e ".[dev]"
      - name: Run tests (with coverage)
        run: pytest -q --cov=addlib --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }} # add this secret (see docs/how-to/codecov.md)
          fail_ci_if_error: false

  c-sanitizers:
    name: C tests + ASan/UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure (with sanitizers)
        run: >
          cmake -S . -B build -DADDLIB_BUILD_TESTS=ON
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  package-smoke:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Install the built wheel and smoke-test it
        run: |
          python -m pip install dist/*.whl
          cd /tmp && python -c "import addlib; assert addlib.add(2, 3) == 5; print('wheel OK', addlib.__version__)"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-smoke
          path: dist/*
