# SPDX-License-Identifier: Apache-2.0
# Build cross-platform wheels (manylinux, macOS incl. Apple Silicon, Windows)
# and an sdist. Runs on tags and on demand; the release workflow consumes the
# artifacts this produces. cibuildwheel config lives in pyproject.toml.
name: Wheels

on:
  # Tagged releases are handled by release.yaml; this workflow is for PR smoke
  # builds and manual runs only.
  workflow_dispatch:
  pull_request:
    paths:
      # Smoke-build wheels when packaging-relevant files change, to catch
      # breakage before a release tag.
      - "pyproject.toml"
      - "setup.py"
      - "MANIFEST.in"
      - "c/**"
      - "python/src/addlib/_build_ffi.py"
      - ".github/workflows/wheels.yml"

permissions:
  contents: read

jobs:
  wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist
      - name: Verify the sdist builds a wheel (carries the C sources)
        run: |
          python -m pip install dist/*.tar.gz
          cd /tmp && python -c "import addlib; assert addlib.add(20, 22) == 42"
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
