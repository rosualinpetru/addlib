# SPDX-License-Identifier: Apache-2.0
# Tag-triggered, fully automated release: build -> SBOM -> provenance -> publish
# (PyPI Trusted Publishing) -> Sigstore-signed GitHub Release. See
# docs/explanation/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU (for aarch64 Linux wheels)
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: pypa/cibuildwheel@v4.0.0
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  sbom:
    name: Generate SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package + CycloneDX
        run: |
          python -m pip install . cyclonedx-bom
      - name: Generate SBOM from the installed environment
        run: cyclonedx-py environment --output-format JSON --output-file addlib-sbom.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: addlib-sbom.json

  publish:
    # NOTE: targets TestPyPI (experimental). For a production PyPI release,
    # change the environment URL to https://pypi.org/p/addlib and remove the
    # `repository-url` from the publish step below (it then defaults to PyPI).
    name: Publish to TestPyPI + signed GitHub Release
    needs: [wheels, sdist, sbom]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/addlib
    permissions:
      contents: write # create the GitHub Release
      id-token: write # PyPI Trusted Publishing + provenance attestation
      attestations: write # SLSA provenance
    steps:
      - name: Collect all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Stage distributions
        run: |
          mkdir -p dist
          find artifacts -name '*.whl' -exec cp {} dist/ \;
          find artifacts -name '*.tar.gz' -exec cp {} dist/ \;
          cp artifacts/sbom/addlib-sbom.json .
          ls -l dist
      - name: Generate SLSA build provenance for the artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
      - name: Publish to TestPyPI (Trusted Publishing — no token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true # don't fail if a file was already uploaded (e.g. tag re-run)
          # We attest/sign separately (attest-build-provenance + sigstore steps),
          # so disable the publish action's own PEP 740 attestation — it hits
          # Sigstore's Rekor for every wheel and is a flaky failure surface.
          attestations: false
      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.4.0
        with:
          inputs: ./dist/*.whl ./dist/*.tar.gz
      - name: Create GitHub Release with signed artifacts + SBOM
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*
            addlib-sbom.json
